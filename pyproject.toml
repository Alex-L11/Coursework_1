[project]
name = "coursework-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex",email = "hopiru@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
dev = [
    "pandas-stubs (>=3.0.5.260914,<4.0.0.0)"
]

[tool.black]
line-length = 119
exclude = '''/( \.git, .hg, .tox )/'''
[tool.isort]
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
